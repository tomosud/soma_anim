name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        run: |
          V=${GITHUB_SHA::8}
          mkdir _site
          cp -r assets NOTICE.md LICENSE _site/
          # cache buster: the scripts live in a folder named after the commit
          cp -r src _site/src.$V
          sed -e "s#\"src/#\"src.$V/#g" -e "s#SOMA_ANIM_VERSION = 'dev'#SOMA_ANIM_VERSION = '$V'#" index.html > _site/index.html
          grep -q "src.$V/app.js" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
