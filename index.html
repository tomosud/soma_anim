<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOMA Anim</title>
<!-- The deploy (.github/workflows/pages.yml) puts the scripts in src.<commit>/ and writes the commit here,
     so a new version never mixes with cached files of the old one. -->
<script>window.SOMA_ANIM_VERSION = 'dev';</script>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading"><div class="box"><div id="loadText">読み込み中…</div><div class="track"><i id="loadBar"></i></div>
  <button id="loadSkip" hidden>待たずに始める（準備ができるまで単純な補間）</button></div></div>
<header>
  <h1 id="title">SOMA Anim</h1>
  <span class="sub">キーポーズ → 自然なポーズ → 生成モデルで中割り</span>
  <span class="grow"></span>
  <button id="newScene" title="新しいシーンを始める（Ctrl+Z で戻せます）">新規</button>
  <button id="undo" title="元に戻す (Ctrl+Z)">↶</button>
  <button id="redo" title="やり直す (Ctrl+Y)">↷</button>
  <button id="save" title="プロジェクトを保存 (.json)">保存</button>
  <button id="load" title="プロジェクトを開く">開く</button>
  <button id="sample" title="サンプルのアクション（300 フレーム）を開く。ポーズの見本だけで組んだもの">サンプル</button>
  <button id="export" title="全フレームのコントロール値を書き出す（Maya の同じリグ用）">Maya 用に書き出し</button>
  <button id="exportFbx" title="骨のアニメーションを FBX で書き出す（メッシュなし。Maya・Unreal 用）">FBX 書き出し</button>
  <input id="file" type="file" accept=".json" hidden>
</header>

<main>
  <div id="view"><canvas id="gl"></canvas><div id="status">読み込み中…</div><div id="hint"></div>
    <div id="pickerPanel" class="float">
      <div class="head">
        <button id="pickerFold" title="ピッカーをたたむ / 開く (P)">▾ ピッカー</button>
        <span class="grow"></span>
        <button id="pickerSmaller" title="小さく">−</button>
        <button id="pickerBigger" title="大きく">＋</button>
      </div>
      <div id="picker"></div>
    </div>
  </div>

  <aside>
    <section>
      <h2>ポーズの自動補正（このフレームのキーごと）</h2>
      <label class="row" title="このキーのポーズを動かしたとき、自然なポーズに直す。キーごとに覚えます（新しいキーはオン）"><input id="auto" type="checkbox" checked> 動かしたら自然なポーズに直す</label>
      <label class="row" title="このキーの足を床に着け、今の位置に留める。ジャンプ・倒れるなどのキーはオフにすると、見本のポーズが空中・寝た姿勢のまま置かれます。キーごとに覚えます（新しいキーはオン）"><input id="lockFeet" type="checkbox" checked> 足を床に着けて留める</label>
      <label class="row">強さ <input id="strength" type="range" min="0" max="1" step="0.05" value="0.8"><span id="strengthV">80%</span></label>
      <label class="row" title="人が保てないポーズを直す: 重心を足の上へ、手足が届くように体を寄せる、足を床の上へ"><input id="balance" type="checkbox" checked> バランスと届く範囲を直す</label>
      <div class="buttons">
        <button id="naturalize" title="今のポーズを参考モーションの一番近い姿勢に寄せる (N)">今のポーズを自然に</button>
        <button id="unpin" title="手で決めた扱いのコントロールを解除する">ピンを全部外す</button>
        <button id="feet" title="両足を今の位置で床に着け、ねじれを戻す。脚が届かなければ腰を下げる (G)">足リセット（接地）</button>
        <button id="feetAll" title="すべてのキーの足を床に着ける">全キーの足を接地</button>
      </div>
      <div id="pins" class="chips"></div>
      <div id="match" class="note"></div>
    </section>

    <section>
      <h2>ポーズの見本</h2>
      <div class="note">マウスを乗せるとそのポーズを試しに表示し、クリックすると今のフレームのキーにします（立っている場所と向きはそのまま、着いている足は今の位置に合わせる）。Shift を押しながらだと左右反転。</div>
      <div id="poseBook"></div>
    </section>

    <section>
      <h2>コントロール</h2>
      <div id="selName" class="selname">（未選択）</div>
      <div id="gizmoMode" class="pick" hidden>
        <button id="modeMove" title="移動 (W)">移動</button>
        <button id="modeTurn" title="回転 (E)">回転</button>
      </div>
      <div id="channels"></div>
      <div class="buttons">
        <button id="resetSel">選択をリセット</button>
        <button id="resetAll" title="ポーズを初期状態に戻す。全身の位置と向き（world_ctl）はそのまま">ポーズをリセット</button>
        <button id="recenter" title="全身の輪（world_ctl）を、すべてのキーで体の真下に置き直す。ポーズと動きは変わらない">輪を体の下へ</button>
      </div>
      <div class="pick">
        <button id="pickWorld" title="全身をまとめて動かす・回すコントロール">全身</button>
        <button data-pick="All_Trans_ctrl">移動系</button>
        <button data-pick="All_Rot_ctrl">回転系</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <section>
      <h2>表示</h2>
      <label class="row"><input id="showCtl" type="checkbox" checked> コントロール</label>
      <label class="row"><input id="showFinger" type="checkbox"> 指のコントロール</label>
      <label class="row"><input id="showMesh" type="checkbox" checked> メッシュ</label>
      <label class="row"><input id="showGhost" type="checkbox" checked> 前後のキーを薄く表示</label>
    </section>
  </aside>
</main>

<footer>
  <div class="bar">
    <button id="first" title="先頭へ">⏮</button>
    <button id="prevKey" title="前のキー (,)">◀◆</button>
    <button id="play" title="再生 / 停止 (Space)">▶</button>
    <button id="nextKey" title="次のキー (.)">◆▶</button>
    <span class="frame">フレーム <input id="frame" type="number" min="0" value="0"> / <input id="length" type="number" min="10" max="2000" value="300"></span>
    <span class="sep"></span>
    <button id="addKey" title="今のポーズをキーにする (K)">◆ キー</button>
    <button id="delKey" title="このフレームのキーを消す (Delete)">削除</button>
    <button id="copy" title="ポーズをコピー (Ctrl+C)">コピー</button>
    <button id="paste" title="貼り付け (Ctrl+V)">貼り付け</button>
    <button id="pasteMirror" title="左右反転して貼り付け (Ctrl+Shift+V)">反転貼り付け</button>
    <button id="mirror" title="このポーズを左右反転 (M)">左右反転</button>
    <span class="grow"></span>
    <label class="row" title="MotionBricks: キーで止まらず、次のキーへ向かう勢いのまま通過する。キーの間隔がそのまま動きの長さになる"><input id="flow" type="checkbox"> キーを通過</label>
    <button id="regen" title="中割りを作り直す (R)">中割りを作り直す</button>
    <label>中割り <select id="mode"><option value="mb">MotionBricks</option><option value="ease">単純な補間</option></select></label>
  </div>
  <canvas id="timeline"></canvas>
</footer>

<script type="module" src="src/app.js"></script>
</body>
</html>
